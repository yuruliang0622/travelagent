substitutions:
  _REGION: us-central1
  _WEB_SERVICE: trip-agent-web
  _API_SERVICE: trip-agent-api

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.web
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/trip-agent/web:$SHORT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - backend/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/trip-agent/api:$SHORT_SHA
      - backend

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/trip-agent/web:$SHORT_SHA

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/trip-agent/api:$SHORT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_API_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/trip-agent/api:$SHORT_SHA
      - --region
      - ${_REGION}
      - --allow-unauthenticated

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_WEB_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/trip-agent/web:$SHORT_SHA
      - --region
      - ${_REGION}
      - --allow-unauthenticated

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/trip-agent/web:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/trip-agent/api:$SHORT_SHA
